name: Release
on:
  push:
    tags: ["v*"]
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        # Full `bun test` is ~40s but currently flakes on TUI handover and
        # mode-apply-selection event ordering. Gate releases on protocol plus
        # a representative server set that includes the eval recorder.
        run: bun test packages/protocol packages/server/src/eval-recorder.test.ts packages/server/src/settings.test.ts packages/server/src/store.test.ts packages/server/src/sidekick.test.ts packages/server/src/tools/rate-delegate.test.ts packages/server/src/shadow-git.test.ts packages/server/src/session-archive.test.ts packages/server/src/incognito-isolation.test.ts packages/server/src/cors.test.ts

  release:
    needs: gate
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - name: Build archive
        run: |
          mkdir -p dist
          tar --exclude=.git --exclude=node_modules --exclude='*.db*' --exclude=.env --exclude=auth.json --exclude=settings.json --exclude=scratchpad --exclude=.claude --exclude=dist -czf dist/chunky-${GITHUB_REF_NAME}.tar.gz .
          sha256sum dist/chunky-${GITHUB_REF_NAME}.tar.gz | awk '{print $1}' > /tmp/sha
          printf '{"version":"%s","sha256":"%s"}\n' "${GITHUB_REF_NAME#v}" "$(cat /tmp/sha)" > dist/latest.json
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
